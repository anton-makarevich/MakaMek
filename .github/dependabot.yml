# Dependabot version updates configuration.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # NuGet packages across all .csproj files (src/ and tests/)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"

  # .NET SDK pinned in global.json (10.0.x)
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"

  # BotAgent Docker image (.NET 10 base images)
  - package-ecosystem: "docker"
    directory: "/src/MakaMek.Tools/BotAgent"
    schedule:
      interval: "weekly"

  # BotContainer Docker image (.NET 10 base images)
  - package-ecosystem: "docker"
    directory: "/src/MakaMek.Tools/BotContainer"
    schedule:
      interval: "weekly"

  # GitHub Actions used in workflow files
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
