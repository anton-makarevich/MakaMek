name: MakaMek Avalonia Library
permissions:
  contents: read
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:
    paths:
      - 'src/MakaMek.Avalonia/**'
      - 'src/MakaMek.Presentation/**'
      - 'src/MakaMek.Bots/**'
      - 'src/MakaMek.Core/**'
      - 'src/MakaMek.SourceGenerators/**'
      - 'tests/MakaMek.Avalonia.Tests/**'
      - '.github/workflows/avalonia.yml'

  workflow_dispatch:
env:
  NuGetDirectory: ${{ github.workspace }}/nuget
  
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run Avalonia tests
        run: dotnet test tests/MakaMek.Avalonia.Tests/MakaMek.Avalonia.Tests.csproj /p:CollectCoverage=true /p:CoverletOutputFormat=opencover /p:ExcludeByAttribute=GeneratedCodeAttribute "/p:Include=\"[Sanet.MakaMek.Avalonia]Sanet.MakaMek.Avalonia.Converters*,[Sanet.MakaMek.Avalonia]Sanet.MakaMek.Avalonia.Game*\""

      - name: Generate diff coverage report
        id: report
        if: github.event_name == 'pull_request'
        uses: anton-makarevich/Cocodif@v0.2.3
        with:
          coverage-files: ./tests/MakaMek.Avalonia.Tests/coverage.opencover.xml
          title: Avalonia Coverage
          include: 'src/MakaMek.Avalonia/**'
          exclude: '**/obj/**,**/bin/**'
          comment: 'false'
          summary: 'false'

      - name: Stage coverage comment artifact
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cocodif-avalonia"
          cp "${{ steps.report.outputs.report-path }}" "$RUNNER_TEMP/cocodif-avalonia/report.md"
          echo "${{ github.event.pull_request.number }}" > "$RUNNER_TEMP/cocodif-avalonia/pr_number"

      - name: Upload coverage comment artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: cocodif-avalonia
          path: ${{ runner.temp }}/cocodif-avalonia
          if-no-files-found: ignore

      - name: Upload Avalonia tests results
        uses: codecov/codecov-action@v7
        with:
          files: ./tests/MakaMek.Avalonia.Tests/coverage.opencover.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
  
  pack-nuget:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
        
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Determine version suffix
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION_SUFFIX=" >> $GITHUB_ENV
          else
            echo "VERSION_SUFFIX=preview" >> $GITHUB_ENV
          fi

      - name: Create nuget packages
        run: |
          dotnet pack src/MakaMek.Avalonia/MakaMek.Avalonia/MakaMek.Avalonia.csproj --configuration Release --output ${{ env.NuGetDirectory }} -p:VersionSuffix=${{ env.VERSION_SUFFIX }}

      # Publishing itself happens in publish-nuget.yml via NuGet Trusted
      # Publishing (OIDC). This job only builds the package after its tests
      # pass and hands it over as an artifact - the artifact existing is the
      # proof that the gate held.
      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-avalonia
          path: ${{ env.NuGetDirectory }}
