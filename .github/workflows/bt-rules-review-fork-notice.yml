name: BT Rules Review (fork notice)

# Fork PRs cannot post comments from a `pull_request` run: the token is read-only
# for forks. `pull_request_target` runs from the default branch with a writable
# token, and this workflow deliberately does NOT check out any repository
# content — it only posts a notice. Never add a checkout to this file.
#
# `synchronize` is intentionally omitted so that a follow-up push does not
# overwrite an existing review result with the notice.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  notice:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name != github.repository
    permissions:
      pull-requests: write
    steps:
      - name: Notice that the review is available on request
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: bt-rules-review
          message: |
            ### BattleTech Rules Review

            This PR comes from a fork, so the rules review does not run
            automatically — the reviewer needs repository secrets that are not
            exposed to fork-triggered workflows.

            A maintainer can run it by commenting `/rules-review` on this PR.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
