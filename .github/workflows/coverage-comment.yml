name: Coverage Comments
permissions:
  contents: read
on:
  workflow_run:
    workflows:
      - MakaMek Core Library
      - MakaMek Presentation Library
      - MakaMek Bots Library
      - MakaMek Avalonia Library
      - MakaMek Assets Library
      - MakaMek Localization Library
      - MakaMek Map Library
    types:
      - completed

jobs:
  post-coverage-comment:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    steps:
      - uses: actions/download-artifact@v4
        id: download
        continue-on-error: true
        with:
          pattern: cocodif-*
          path: coverage
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate report and resolve PR number
        id: resolve
        if: steps.download.outcome == 'success'
        shell: bash
        run: |
          test -f coverage/report.md
          PR_NUMBER=$(cat coverage/pr_number 2>/dev/null | tr -d '[:space:]')
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="${{ github.event.workflow_run.pull_requests[0].number }}"
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::Could not determine pull request number from artifact or workflow_run event"
            exit 1
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Post coverage comment
        if: steps.resolve.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          number: ${{ steps.resolve.outputs.pr_number }}
          header: ${{ github.event.workflow_run.name }}
          path: coverage/report.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}