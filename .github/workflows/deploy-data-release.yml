name: Deploy Data Release to Cloudflare R2

on:
  push:
    tags:
      - 'v*'
  # TODO: temporary — for testing the per-asset-type manifests pipeline; remove before release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "data-release"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate per-asset-type data manifests
        env:
          DATA_R2_BASE_URL: ${{ vars.DATA_R2_BASE_URL }}
        run: |
          VERSION=$(sed -n 's/.*<VersionPrefix>\([^<]*\)<\/VersionPrefix>.*/\1/p' Directory.Build.props)
          if [ -z "$VERSION" ]; then echo "Could not read VersionPrefix from Directory.Build.props"; exit 1; fi
          dotnet run --file .github/scripts/generate-data-manifest.cs -- data "$VERSION"

      - name: Upload assets and manifests to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          aws configure set aws_access_key_id "$R2_ACCESS_KEY_ID" --profile r2
          aws configure set aws_secret_access_key "$R2_SECRET_ACCESS_KEY" --profile r2
          aws configure set region auto --profile r2

          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"

          echo "Syncing data/ to bucket ${CLOUDFLARE_R2_BUCKET}..."
          # Per-asset-type manifests (data/units/manifest.json, data/hexes/manifest.json)
          # are generated before the sync and live inside the data/ tree, so this single
          # sync publishes them together with the assets.
          aws s3 sync data "s3://${CLOUDFLARE_R2_BUCKET}" \
            --endpoint-url "$ENDPOINT" \
            --profile r2 \
            --delete \
            --no-progress
