name: Discord Notifications

# Posts a short LLM-written summary of every merged PR to #dev-log and of every
# published release to #releases.
#
# Deliberately a separate workflow from the build pipelines: an LLM or Discord
# outage must never turn a green build red. Failures here are cosmetic - the
# summary step is best-effort and falls back to posting the title/link alone.
#
# Uses the OpenCode Go inference endpoint (OpenAI-compatible), which - unlike
# the console free tier (e.g. `big-pickle`) - is documented for direct API use:
# https://opencode.ai/docs/go/#endpoints. It requires a stable
# `x-opencode-session` header and a client-specific User-Agent.
# Verified by hand: glm-5.3-flash answers this endpoint with a plain bearer key.

on:
  pull_request:
    types: [closed]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  dev-log:
    # `release` also triggers this file; only run the PR job for actual merges.
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Best-effort: if the model is rate-limited, unavailable, or the secret is
      # missing (e.g. a fork PR), we still post - just without the summary.
      - name: Summarize PR
        id: summarize
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          # Tried in order; all must be OpenAI-compatible models served by the
          # Go endpoint. glm-5.3-flash is a reasoning model - it needs a high
          # max_tokens so the reasoning phase leaves room for actual content.
          MODELS: glm-5.3-flash deepseek-v4.1-flash
          SYSTEM_PROMPT: >-
            You write terse changelog lines for a game-development Discord
            channel. Summarize the merged pull request in one or two plain
            sentences, at most 240 characters. Say what changed for players or
            developers, not how the PR was made. No markdown, no heading, no
            emoji, no preamble.
        run: |
          set -euo pipefail

          # PR bodies are untrusted input: they only ever reach the model as
          # JSON built by jq, never interpolated into the shell, and are capped
          # so a huge description cannot blow up latency or token usage.
          body="${BODY:0:12000}"
          summary=""

          for model in $MODELS; do
            jq -n \
              --arg model "$model" \
              --arg system "$SYSTEM_PROMPT" \
              --arg title "$TITLE" \
              --arg body "$body" \
              '{
                 model: $model,
                 temperature: 0.3,
                 max_tokens: 1000,
                 messages: [
                   { role: "system", content: $system },
                   { role: "user", content: ("Title: " + $title + "\n\nDescription:\n" + $body) }
                 ]
               }' > request.json

            # No `--fail`: on 4xx/5xx we want the error body, so the log says
            # "401 invalid api key" or "429 rate limited" instead of nothing.
            http=$(curl -s --max-time 90 \
                     -o response.json -w '%{http_code}' \
                     https://opencode.ai/inference/go/openai/v1/chat/completions \
                     -H "Authorization: Bearer ${OPENCODE_API_KEY:-}" \
                     -H "Content-Type: application/json" \
                     -H "x-opencode-session: makamek-discord-notify" \
                     -H "User-Agent: makamek-discord-notify/1.0" \
                     -d @request.json) || http=000

            if [[ "$http" == "200" ]]; then
              summary=$(jq -r '.choices[0].message.content // ""' response.json 2>/dev/null || true)
              if [[ -n "${summary//[[:space:]]/}" ]]; then
                echo "Summary generated by $model"
                break
              fi
              echo "::warning::Model $model returned an empty summary"
            else
              echo "::warning::Model $model failed (HTTP $http): $(jq -r '.error.message // empty' response.json 2>/dev/null || true)"
            fi
            summary=""
          done

          printf '%s' "$summary" > summary.txt

      - name: Post to #dev-log
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_DEV_LOG }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail

          if [[ -z "${WEBHOOK:-}" ]]; then
            echo "::warning::DISCORD_WEBHOOK_DEV_LOG is not set; skipping"
            exit 0
          fi

          # Subshell-safe fallback: a missing/empty summary must not lose the post.
          [[ -s summary.txt ]] || printf '' > summary.txt

          # `allowed_mentions: { parse: [] }` is the real defence against an
          # @everyone smuggled in through a PR body or a model hallucination.
          jq -n \
            --rawfile summary summary.txt \
            --arg title "$PR_TITLE" \
            --arg url "$PR_URL" \
            --arg author "$PR_AUTHOR" \
            '{
               content: (
                 "**" + $title + "**\n"
                 + (($summary | gsub("\\s+$"; "") | .[0:600]) | if . == "" then "" else . + "\n" end)
                 + $url + " (by " + $author + ")"
               ),
               allowed_mentions: { parse: [] }
             }' > payload.json

          curl -sf --max-time 30 -X POST \
            -H "Content-Type: application/json" \
            -d @payload.json "$WEBHOOK"

  releases:
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Summarize release
        id: summarize
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          # build-windows.yml creates the release with generate_release_notes: true,
          # so this body already contains GitHub's generated notes.
          BODY: ${{ github.event.release.body }}
          MODELS: glm-5.3-flash deepseek-v4.1-flash
          SYSTEM_PROMPT: >-
            You condense GitHub release notes into a short Discord announcement
            for players of a BattleTech tactics game. Produce 3 to 5 bullet
            points, each starting with "- ", at most 700 characters in total.
            Lead with the changes that matter most to players. Plain text only:
            no markdown headings, no links, no emoji, no preamble.
        run: |
          set -euo pipefail

          body="${BODY:0:16000}"
          summary=""

          for model in $MODELS; do
            jq -n \
              --arg model "$model" \
              --arg system "$SYSTEM_PROMPT" \
              --arg name "$RELEASE_NAME" \
              --arg tag "$RELEASE_TAG" \
              --arg body "$body" \
              '{
                 model: $model,
                 temperature: 0.3,
                 max_tokens: 1500,
                 messages: [
                   { role: "system", content: $system },
                   { role: "user", content: ("Release: " + $name + " (" + $tag + ")\n\nNotes:\n" + $body) }
                 ]
               }' > request.json

            # No `--fail`: on 4xx/5xx we want the error body, so the log says
            # "401 invalid api key" or "429 rate limited" instead of nothing.
            http=$(curl -s --max-time 90 \
                     -o response.json -w '%{http_code}' \
                     https://opencode.ai/inference/go/openai/v1/chat/completions \
                     -H "Authorization: Bearer ${OPENCODE_API_KEY:-}" \
                     -H "Content-Type: application/json" \
                     -H "x-opencode-session: makamek-discord-notify" \
                     -H "User-Agent: makamek-discord-notify/1.0" \
                     -d @request.json) || http=000

            if [[ "$http" == "200" ]]; then
              summary=$(jq -r '.choices[0].message.content // ""' response.json 2>/dev/null || true)
              if [[ -n "${summary//[[:space:]]/}" ]]; then
                echo "Summary generated by $model"
                break
              fi
              echo "::warning::Model $model returned an empty summary"
            else
              echo "::warning::Model $model failed (HTTP $http): $(jq -r '.error.message // empty' response.json 2>/dev/null || true)"
            fi
            summary=""
          done

          printf '%s' "$summary" > summary.txt

      - name: Post to #releases
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          if [[ -z "${WEBHOOK:-}" ]]; then
            echo "::warning::DISCORD_WEBHOOK_RELEASES is not set; skipping"
            exit 0
          fi

          [[ -s summary.txt ]] || printf '' > summary.txt

          jq -n \
            --rawfile summary summary.txt \
            --arg name "$RELEASE_NAME" \
            --arg tag "$RELEASE_TAG" \
            --arg url "$RELEASE_URL" \
            --arg prerelease "$IS_PRERELEASE" \
            '{
               content: (
                 "**" + (if $name == "" then $tag else $name end) + "**"
                 + (if $prerelease == "true" then " (pre-release)" else "" end) + "\n"
                 + (($summary | gsub("\\s+$"; "")) | .[0:1500] | if . == "" then "" else . + "\n" end)
                 + $url
               ),
               allowed_mentions: { parse: [] }
             }' > payload.json

          curl -sf --max-time 30 -X POST \
            -H "Content-Type: application/json" \
            -d @payload.json "$WEBHOOK"
