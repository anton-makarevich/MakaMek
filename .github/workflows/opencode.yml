name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    timeout-minutes: 60
    if: |
      (contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')) &&
      github.event.comment.user.type != 'Bot' &&
        contains(
          fromJson('["OWNER"]'),
          github.event.comment.author_association
        )
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@v4

      - name: Install skills
        run: mise run install-skills

      - name: Install Serena
        run: mise run install-serena

      - name: Configure Serena for OpenCode
        run: |
          # Ensure uv tool bin dir is in PATH so `serena` is found
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cat > opencode.json << 'EOF'
          {
            "mcp": {
              "servers": {
                "serena": {
                  "type": "local",
                  "command": ["serena", "start-mcp-server", "--context=ide", "--project", "."],
                  "disabled": false
                },
                "avalonia-docs": {
                  "type": "remote",
                  "url": "https://docs-mcp.avaloniaui.net/mcp",
                  "disabled": false
                }
              }
            }
          }
          EOF

      - name: Run OpenCode
        uses: anomalyco/opencode/github@v2.0.32
        env:
          # Must match the provider id: model `opencode/...` authenticates via
          # OPENCODE_API_KEY (the Console/Zen/Go key), not OPENROUTER_API_KEY.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/big-pickle
          share: true
          agent: build
