name: opencode

# Runs the OpenCode CLI directly instead of `anomalyco/opencode/github`.
#
# The action was a composite wrapper that installed OpenCode 1.x `latest` at run
# time (its `@v*` ref versions the action script, not the CLI), so the CLI
# version could never be pinned or shared with the other workflows. The version
# now lives in exactly one place: the `install-opencode` task in mise.toml.
#
# Trust model: the agent can push commits, so it is started ONLY by the
# repository owner typing `/oc` as the first word of a comment. Fork pull
# requests are not supported: this job holds write credentials and GITHUB_TOKEN
# cannot push to a fork, so a fork PR is refused before any fork code is checked
# out or any tool is installed.
#
# The review target is pinned to an immutable commit SHA, and the run is refused
# when that commit is newer than the triggering comment, so the code that is
# executed cannot change between the owner's command and the checkout.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  # One agent run per issue/PR: two runs on the same branch would race on push.
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  # Cheap triage with no checkout. Decides whether the privileged job may run at
  # all, so no tooling is installed and no code is checked out for refused
  # requests. Its only write permission is the refusal comment.
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: |
      contains(github.event.comment.body, '/oc') &&
      github.event.comment.user.type != 'Bot' &&
      github.event.comment.author_association == 'OWNER'
    permissions:
      contents: read
      pull-requests: read
      issues: write
    outputs:
      number: ${{ steps.ctx.outputs.number }}
      is_pr: ${{ steps.ctx.outputs.is_pr }}
      head_ref: ${{ steps.ctx.outputs.head_ref }}
      head_sha: ${{ steps.ctx.outputs.head_sha }}
      branch_sha: ${{ steps.ctx.outputs.branch_sha }}
      base_ref: ${{ steps.ctx.outputs.base_ref }}
      comment_api: ${{ steps.ctx.outputs.comment_api }}
      runnable: ${{ steps.ctx.outputs.runnable }}
    steps:
      - name: Resolve issue/PR context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event_name == 'pull_request_review_comment' }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail

          # The command must be the first word of the comment, so prose that
          # merely mentions `/oc` cannot start a run.
          first_line="${COMMENT_BODY%%$'\n'*}"
          first_line="${first_line#"${first_line%%[![:space:]]*}"}"
          if [[ ! "${first_line}" =~ ^/oc([[:space:]]|$) ]]; then
            echo "Not an /oc command; nothing to do."
            echo "runnable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          runnable="true"
          reason=""
          head_sha=""
          branch_sha=""
          if [ "${IS_PR}" = "true" ]; then
            pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}")"
            head_ref="$(jq -r '.head.ref' <<<"${pr_json}")"
            head_sha="$(jq -r '.head.sha' <<<"${pr_json}")"
            base_ref="$(jq -r '.base.ref' <<<"${pr_json}")"
            head_repo="$(jq -r '.head.repo.full_name' <<<"${pr_json}")"
            if [ "${head_repo}" != "${GITHUB_REPOSITORY}" ]; then
              # Fork PR: this job would hold write credentials while running
              # fork-controlled instructions, and GITHUB_TOKEN cannot push to
              # the fork anyway. Refuse before any checkout.
              runnable="false"
              reason="Fork pull requests are not supported. The agent runs with write credentials, so it only runs on branches in \`${GITHUB_REPOSITORY}\`. Ask a maintainer to open a branch here if you need this reviewed."
            fi
          else
            head_ref="opencode/issue-${NUMBER}"
            base_ref="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
            # The issue branch is ours; resolve its current tip to an immutable
            # SHA so the checkout does not follow a mutable ref. `gh api` prints
            # the JSON error body to stdout when the request fails (only the
            # `gh: ...` line goes to stderr), so `2>/dev/null || true` alone
            # would capture `{"message":"Not Found",...}` for a missing branch
            # and pass it on as a git refspec. Only accept a real object id.
            branch_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${head_ref}" \
              --jq '.object.sha' 2>/dev/null || true)"
            if ! [[ "${branch_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              branch_sha=""
            fi
          fi

          {
            echo "number=${NUMBER}"
            echo "is_pr=${IS_PR}"
            echo "head_ref=${head_ref}"
            echo "head_sha=${head_sha}"
            echo "branch_sha=${branch_sha}"
            echo "base_ref=${base_ref}"
            echo "comment_api=$([ "${EVENT_NAME}" = "pull_request_review_comment" ] && echo pulls || echo issues)"
            echo "runnable=${runnable}"
          } >> "$GITHUB_OUTPUT"

          if [ "${runnable}" = "false" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/comments" \
              -f body="**opencode:** ${reason}" > /dev/null
          fi

  opencode:
    needs: triage
    if: needs.triage.outputs.runnable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      # A PAT (if configured) keeps pushes able to trigger CI; GITHUB_TOKEN
      # pushes never start workflow runs. Works unchanged without the secret.
      GH_TOKEN: ${{ secrets.OPENCODE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      # First step: the command must be newer than the commit it will review, so
      # the code cannot change between the owner's /oc and the execution. This
      # runs before any checkout.
      - name: Verify the command is newer than the reviewed commit
        env:
          IS_PR: ${{ needs.triage.outputs.is_pr }}
          HEAD_SHA: ${{ needs.triage.outputs.head_sha }}
          COMMENT_AT: ${{ github.event.comment.created_at }}
        run: |
          set -euo pipefail
          if [ "${IS_PR}" = "true" ]; then
            head_commit_at="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}" \
              --jq '.commit.committer.date')"
            comment_epoch="$(date -d "${COMMENT_AT}" +%s)"
            commit_epoch="$(date -d "${head_commit_at}" +%s)"
            if [ "${commit_epoch}" -gt "${comment_epoch}" ]; then
              echo "::error::PR head ${HEAD_SHA} was committed after the /oc command; comment /oc again to review the new head."
              exit 1
            fi
          fi

      # Trusted tooling comes from the default branch, never from the PR head.
      - name: Checkout default branch for tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install mise tools
        uses: jdx/mise-action@v4

      - name: Install OpenCode CLI
        run: mise run install-opencode

      - name: Install skills
        run: mise run install-skills

      - name: Install Serena
        run: mise run install-serena

      - name: Configure Serena for OpenCode
        run: |
          # Ensure uv tool bin dir is in PATH so `serena` is found
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cat > opencode.json << 'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "mcp": {
              "servers": {
                "serena": {
                  "type": "local",
                  "command": ["serena", "start-mcp-server", "--context=ide", "--project", "."],
                  "disabled": false
                },
                "avalonia-docs": {
                  "type": "remote",
                  "url": "https://docs-mcp.avaloniaui.net/mcp",
                  "disabled": false
                }
              }
            }
          }
          EOF

      - name: Prepare working branch
        id: branch
        env:
          IS_PR: ${{ needs.triage.outputs.is_pr }}
          HEAD_REF: ${{ needs.triage.outputs.head_ref }}
          HEAD_SHA: ${{ needs.triage.outputs.head_sha }}
          BRANCH_SHA: ${{ needs.triage.outputs.branch_sha }}
        run: |
          set -euo pipefail
          branch_created="false"
          if [ "${IS_PR}" = "true" ]; then
            # Immutable commit, never a branch ref: the code cannot change
            # between the date check above and this checkout.
            git fetch --no-tags --depth=1 origin "${HEAD_SHA}"
            git checkout -B "${HEAD_REF}" "${HEAD_SHA}"
          elif [[ "${BRANCH_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            # A `/oc` on the same issue again: continue on the existing branch.
            git fetch --no-tags --depth=1 origin "${BRANCH_SHA}"
            git checkout -B "${HEAD_REF}" "${BRANCH_SHA}"
          else
            # First `/oc` on this issue: branch off the default branch and
            # publish the branch immediately, so the run owns a stable target
            # that can be removed again when it produces nothing.
            git checkout -B "${HEAD_REF}"
            if gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/heads/${HEAD_REF}" \
                -f sha="$(git rev-parse HEAD)" > /dev/null; then
              branch_created="true"
            else
              # Created concurrently (or already present): adopt it instead of
              # losing the run.
              existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${HEAD_REF}" \
                --jq '.object.sha' 2>/dev/null || true)"
              if [[ "${existing_sha}" =~ ^[0-9a-f]{40}$ ]]; then
                git fetch --no-tags --depth=1 origin "${existing_sha}"
                git checkout -B "${HEAD_REF}" "${existing_sha}"
              else
                echo "::error::Could not create or resolve the branch ${HEAD_REF}."
                exit 1
              fi
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "branch_created=${branch_created}" >> "$GITHUB_OUTPUT"
          echo "head_before=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Write the request
        id: request
        env:
          NUMBER: ${{ needs.triage.outputs.number }}
          IS_PR: ${{ needs.triage.outputs.is_pr }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          REVIEW_PATH: ${{ github.event.comment.path }}
          REVIEW_LINE: ${{ github.event.comment.line }}
          REVIEW_HUNK: ${{ github.event.comment.diff_hunk }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          request="${RUNNER_TEMP}/opencode-request.md"
          {
            echo "# Request from @${COMMENT_AUTHOR}"
            echo
            echo "Source: ${COMMENT_URL}"
            echo "Run: ${RUN_URL}"
            if [ "${IS_PR}" = "true" ]; then
              echo "Target: pull request #${NUMBER} (checked out in this worktree)"
            else
              echo "Target: issue #${NUMBER}"
            fi
            if [ -n "${REVIEW_PATH}" ]; then
              echo
              echo "Review comment on \`${REVIEW_PATH}\`${REVIEW_LINE:+ line ${REVIEW_LINE}}:"
              echo
              echo '```diff'
              printf '%s\n' "${REVIEW_HUNK}"
              echo '```'
            fi
            echo
            echo "## Request"
            echo
            printf '%s\n' "${COMMENT_BODY}"
          } > "${request}"
          echo "file=${request}" >> "$GITHUB_OUTPUT"

      - name: Acknowledge the request
        continue-on-error: true
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_API: ${{ needs.triage.outputs.comment_api }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/${COMMENT_API}/comments/${COMMENT_ID}/reactions" \
            -f content="eyes" > /dev/null 2>&1 || true

      - name: Run OpenCode
        id: agent
        continue-on-error: true
        env:
          # Must match the provider id: model `opencode/...` authenticates via
          # OPENCODE_API_KEY (the Console/Zen/Go key), not OPENROUTER_API_KEY.
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          REQUEST_FILE: ${{ steps.request.outputs.file }}
          MODEL: opencode/big-pickle
          NO_COLOR: "1"
        run: |
          set -uo pipefail
          opencode --version
          prompt="$(cat <<'PROMPT'
          Read the request file first: __REQUEST_FILE__

          It contains the GitHub comment that triggered this run and its context.
          Implement the request in the repository checked out in this worktree.

          - Work autonomously. Do not ask questions.
          - Do not run `git push`, open pull requests, or post comments: CI publishes
            your changes after the run.
          - If you change tracked files, commit them with a Conventional Commit
            subject (feat/fix/refactor/docs/test/chore).
          - Follow the repository AGENTS.md.
          - Reply with a short summary of what you changed; it is posted back to the
            issue or pull request.
          PROMPT
          )"
          prompt="${prompt//__REQUEST_FILE__/${REQUEST_FILE}}"
          opencode run --standalone --auto --agent build --model "${MODEL}" "${prompt}" 2>&1 | tee "${RUNNER_TEMP}/opencode.log"

      - name: Commit changes
        id: commit
        if: steps.agent.outcome == 'success'
        env:
          HEAD_BEFORE: ${{ steps.branch.outputs.head_before }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: apply opencode request" \
              -m "Requested by @${COMMENT_AUTHOR} in ${COMMENT_URL}"
          fi
          if [ "$(git rev-parse HEAD)" != "${HEAD_BEFORE}" ]; then
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        id: push
        if: steps.commit.outputs.committed == 'true'
        env:
          IS_PR: ${{ needs.triage.outputs.is_pr }}
          HEAD_REF: ${{ needs.triage.outputs.head_ref }}
          BASE_REF: ${{ needs.triage.outputs.base_ref }}
          NUMBER: ${{ needs.triage.outputs.number }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git push origin "HEAD:${HEAD_REF}"
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          if [ "${IS_PR}" = "false" ]; then
            title="$(git log -1 --pretty=%s)"
            body="$(printf 'Closes #%s\n\nRequested by @%s. Run: %s' \
              "${NUMBER}" "${COMMENT_AUTHOR}" "${RUN_URL}")"
            create_err="${RUNNER_TEMP}/pr-create.err"
            pr_url=""
            if ! pr_url="$(gh pr create --base "${BASE_REF}" --head "${HEAD_REF}" \
                --title "${title}" --body "${body}" 2>"${create_err}")"; then
              pr_url="$(gh pr list --head "${HEAD_REF}" --state open \
                --json url --jq '.[0].url // empty' 2>/dev/null || true)"
            fi
            if [ -z "${pr_url}" ]; then
              # Pushing without a PR would leave the issue branch unreachable.
              echo "::error::Could not create or find a pull request for ${HEAD_REF}."
              cat "${create_err}" 2>/dev/null || true
              exit 1
            fi
            echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"
          fi

      # A run that publishes nothing must not leave a dead branch behind. Only
      # branches this run created are removed: an existing one may hold commits
      # from an earlier run and its pull request. A failed push is safe to clean
      # up (nothing reached the remote), but a pushed branch with a failed PR
      # creation is not: that branch carries the agent's commits.
      - name: Delete the branch when nothing was published
        id: cleanup
        if: >-
          always() &&
          steps.branch.outputs.branch_created == 'true' &&
          (steps.commit.outputs.committed != 'true' || steps.push.outputs.sha == '')
        env:
          HEAD_REF: ${{ needs.triage.outputs.head_ref }}
          EXPECTED_SHA: ${{ steps.branch.outputs.head_before }}
        run: |
          set -uo pipefail
          if [ -z "${EXPECTED_SHA:-}" ]; then
            echo "::warning::No branch SHA was recorded; leaving ${HEAD_REF} in place rather than deleting an unknown ref."
            exit 0
          fi
          # Lease-protected delete: only remove the ref if it still points at the
          # SHA this run created. A plain REST DELETE would also take a commit
          # another writer pushed in the meantime (the agent has a write token,
          # so "do not push" is a prompt, not an enforcement boundary).
          git config --local http.https://github.com/.extraheader \
            "AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          if git push origin --delete "${HEAD_REF}" \
               --force-with-lease="refs/heads/${HEAD_REF}:${EXPECTED_SHA}" 2>/dev/null; then
            echo "deleted=true" >> "$GITHUB_OUTPUT"
            echo "Deleted the unused branch ${HEAD_REF}."
          else
            echo "::warning::Could not delete ${HEAD_REF}: it moved since this run created it, or it is already gone."
          fi

      - name: Report the result
        if: always()
        env:
          NUMBER: ${{ needs.triage.outputs.number }}
          HEAD_REF: ${{ needs.triage.outputs.head_ref }}
          PREPARE_OUTCOME: ${{ steps.branch.outcome }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          PUSH_OUTCOME: ${{ steps.push.outcome }}
          PUSHED_SHA: ${{ steps.push.outputs.sha }}
          PR_URL: ${{ steps.push.outputs.pr_url }}
          BRANCH_DELETED: ${{ steps.cleanup.outputs.deleted }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          log="${RUNNER_TEMP}/opencode.log"
          failed=""
          if [ "${PREPARE_OUTCOME}" = "failure" ]; then failed="prepare branch"; fi
          # `skipped` only means an earlier step failed: blame the agent for an
          # actual failure, not for never having been reached.
          if [ "${AGENT_OUTCOME}" = "failure" ] || [ "${AGENT_OUTCOME}" = "cancelled" ]; then
            failed="${failed:+${failed}, }agent"
          fi
          if [ "${COMMIT_OUTCOME}" = "failure" ]; then
            failed="${failed:+${failed}, }commit"
          fi
          if [ "${PUSH_OUTCOME}" = "failure" ]; then
            failed="${failed:+${failed}, }push"
          fi
          {
            echo "### 🤖 opencode"
            echo
            if [ -n "${failed}" ]; then
              echo "**Run failed:** ${failed} step failed. Last output:"
              echo
              echo '```'
              tail -n 40 "${log}" 2>/dev/null || echo "no output captured"
              echo '```'
              echo
              echo "See the [workflow run](${RUN_URL}) for the failing step's log."
            elif [ -n "${PR_URL}" ]; then
              echo "Opened ${PR_URL}"
              echo
            fi
            if [ "${BRANCH_DELETED}" = "true" ]; then
              echo "Nothing was published, so the unused branch \`${HEAD_REF}\` was deleted."
              echo
            fi
            if [ -s "${log}" ] && [ -z "${failed}" ]; then
              # Keep the end of the log: the summary is the last thing the agent writes.
              if [ "$(wc -c < "${log}")" -gt 55000 ]; then
                echo "_(log truncated, showing the last 55000 bytes)_"
                tail -c 55000 "${log}"
              else
                cat "${log}"
              fi
            fi
            echo
            if [ -n "${PUSHED_SHA}" ] && [ -z "${failed}" ]; then
              echo "**Pushed:** \`${PUSHED_SHA}\`"
            fi
            echo "**Run:** [workflow run](${RUN_URL})"
          } > "${RUNNER_TEMP}/comment.md"
          head -c 60000 "${RUNNER_TEMP}/comment.md" > "${RUNNER_TEMP}/comment.trimmed.md"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/comments" \
            -F body="@${RUNNER_TEMP}/comment.trimmed.md" > /dev/null 2>&1 || \
            echo "::warning::Could not post the result comment."
          # Mirror the old action's behaviour: a failed agent/commit/push fails
          # the run, so an unpublished change is never reported as success.
          if [ -n "${failed}" ]; then
            exit 1
          fi

      - name: Remove the acknowledgement reaction
        if: always()
        continue-on-error: true
        env:
          COMMENT_ID: ${{ github.event.comment.id }}
          COMMENT_API: ${{ needs.triage.outputs.comment_api }}
        run: |
          id="$(gh api "repos/${GITHUB_REPOSITORY}/${COMMENT_API}/comments/${COMMENT_ID}/reactions" \
            --jq '.[] | select(.content == "eyes") | .id' | head -n1)"
          if [ -n "${id}" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/${COMMENT_API}/comments/${COMMENT_ID}/reactions/${id}" > /dev/null
          fi
