name: Publish NuGet

# Single entry point for pushing packages to nuget.org, using NuGet Trusted
# Publishing (OIDC) instead of a long-lived API key. See #1549.
#
# Each module workflow packs its own package after its tests pass and uploads
# it as a `nuget-*` artifact; this workflow collects that artifact and pushes
# it. Centralising the push here means exactly ONE trusted publishing policy on
# nuget.org, because a policy is bound to a workflow *filename* (not to a
# package), and the policy owner (`NUGET_USER`) covers all MakaMek packages.
#
# NOTE: `workflows:` below matches each workflow's `name:` field, not its
# filename. Renaming one of those names silently stops that package from being
# published - update this list in the same PR.

permissions:
  contents: read

on:
  workflow_run:
    workflows:
      - MakaMek Core Library
      - MakaMek Map Library
      - MakaMek Localization Library
      - MakaMek Assets Library
      - MakaMek Bots Library
      - MakaMek Presentation Library
      - MakaMek Services Library
      - MakaMek Avalonia Controls Library
      - MakaMek Services Avalonia Library
      - MakaMek Services Avalonia Browser Library
      - MakaMek Avalonia Library
    types:
      - completed

jobs:
  publish-nuget:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write # OIDC token exchange
    # This event also fires for pull_request runs, which run in the context of
    # the default branch with full secrets - including runs from forks. Only
    # act on successful pushes (main / v* tags) that produced an artifact.
    #
    # `head_repository` and `head_branch` are checked here *and* re-checked by
    # the step below. A `workflow_run` job gets the OIDC token regardless of
    # who triggered the source run, so an untrusted run must never reach the
    # download/push steps.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.head_branch == 'main' ||
       startsWith(github.event.workflow_run.head_branch, 'v'))
    steps:
      # Defence in depth, and the precise check: the `if:` above allowlists the
      # ref *class*, this rejects a malformed release tag before anything is
      # fetched. Values go through `env:` rather than being interpolated into
      # the script, so a crafted ref name cannot inject shell.
      - name: Verify triggering run is a trusted release ref
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REPOSITORY" != "$EXPECTED_REPOSITORY" ]]; then
            echo "::error::Refusing to publish: triggering run is from '$HEAD_REPOSITORY', not '$EXPECTED_REPOSITORY'"
            exit 1
          fi
          if [[ "$HEAD_REF" != "main" && ! "$HEAD_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.].*)?$ ]]; then
            echo "::error::Refusing to publish: '$HEAD_REF' is neither 'main' nor a v<major>.<minor>.<patch> release tag"
            exit 1
          fi
          echo "Publishing from $HEAD_REPOSITORY@$HEAD_REF"

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          pattern: nuget-*
          path: nuget
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # Deliberately last: the exchanged API key is only valid for one hour, so
      # it is requested immediately before the push rather than up front.
      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push packages to NuGet
        shell: bash
        run: |
          if ! compgen -G "nuget/*.nupkg" > /dev/null; then
            echo "::error::No .nupkg found in the downloaded artifact"
            exit 1
          fi
          dotnet nuget push nuget/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate