name: MakaMek Services Library
permissions:
  contents: read
on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  pull_request:
    paths:
      - 'src/MakaMek.Services/**'
      - '.github/workflows/services.yml'

  workflow_dispatch:
env:
  NuGetDirectory: ${{ github.workspace }}/nuget
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore src/MakaMek.Services/MakaMek.Services.csproj

      - name: Build Services
        run: dotnet build src/MakaMek.Services/MakaMek.Services.csproj --configuration Release --no-restore
  
  pack-nuget:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Determine version suffix
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION_SUFFIX=" >> $GITHUB_ENV
          else
            echo "VERSION_SUFFIX=preview" >> $GITHUB_ENV
          fi

      - name: Create nuget packages
        run: |
          dotnet pack src/MakaMek.Services/MakaMek.Services.csproj --configuration Release --output ${{ env.NuGetDirectory }} -p:VersionSuffix=${{ env.VERSION_SUFFIX }}

      # Publishing itself happens in publish-nuget.yml via NuGet Trusted
      # Publishing (OIDC). This job only builds the package after its tests
      # pass and hands it over as an artifact - the artifact existing is the
      # proof that the gate held.
      - name: Upload NuGet package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget-services
          path: ${{ env.NuGetDirectory }}
