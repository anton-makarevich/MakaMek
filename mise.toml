[tools]
"gh" = "2.96.0"
"pulumi" = "3.259.0"
"uv" = "0.12.0"

# The OpenCode CLI is intentionally NOT a mise tool: it is only needed by the
# `opencode` and `bt-rules-review` workflows, so it is installed on demand.
# This task is the single source of truth for its version.
[tasks.install-opencode]
description = "Installs the pinned OpenCode CLI (used by the GitHub workflows)"
run = """
npm install -g @opencode/cli@2.1.4
opencode --version
"""

[tasks.install-skills]
description = "Installs all skills (local + third-party) to .agents/skills and .claude/skills via the skills.sh CLI"
run = [
  "npx -y skills add ./skills --agent claude-code opencode -y",
  "npx -y skills add https://github.com/atherio-danp/cde-dotnetcc/tree/main/.claude/skills --skill dotnet-performance-review --agent claude-code opencode -y",
  "npx -y skills add https://github.com/vercel-labs/skills --skill find-skills --agent claude-code opencode -y",
  "npx -y skills add https://github.com/mattpocock/skills --skill tdd --skill triage --skill to-tickets --agent claude-code opencode -y",
  "npx -y skills add https://github.com/anton-makarevich/MagicalYatzyXF/skills --agent claude-code opencode -y",
  "npx -y skills add https://github.com/anthropics/skills --skill skill-creator --agent claude-code opencode -y"
]

[tasks.install-serena]
description = "Installs the Serena MCP server via uv tool install"
run = """
uv tool install -p 3.13 serena-agent
serena --version
"""

[tasks.install-devtools]
description = "Installs or updates the AvaloniaUI Developer Tools global dotnet tool (avdt), required for F12 DevTools in the Desktop app"
run = "dotnet msbuild -t:InstallAvaloniaDevTools Directory.Build.props"

[tasks.update-serena]
description = "Updates the Serena MCP server to the latest version"
run = "uv tool upgrade -p 3.13 serena-agent"

[tasks.install-cognee]
description = "Installs the Cognee MCP server via uv tool install (required by the OpenCode cognee MCP config)"
run = """
uv tool install -p 3.13 cognee-mcp
cognee-mcp --help
"""

[tasks.update-cognee]
description = "Updates the Cognee MCP server to the latest version"
run = "uv tool upgrade -p 3.13 cognee-mcp"

[tasks.analyzer-gate]
description = "Runs the diff-scoped .NET analyzer gate on changed C# files (vs origin/main, or explicit files)"
run = '''
#!/usr/bin/env bash
set -euo pipefail

base="${ANALYZER_BASE:-origin/main}"
config_changed=false
files=()

if [ "$#" -gt 0 ]; then
  for arg in "$@"; do
    if [ "$arg" = "CodeMetricsConfig.txt" ]; then
      config_changed=true
    else
      files+=("$arg")
    fi
  done
else
  if ! git rev-parse --verify --quiet "$base" >/dev/null; then
    echo "Base '$base' not found, falling back to 'main'. Run 'git fetch' for an up-to-date diff." >&2
    base="main"
  fi
  if ! git rev-parse --verify --quiet "$base" >/dev/null; then
    echo "ERROR: neither the requested base nor 'main' exists. Run 'git fetch' or set ANALYZER_BASE." >&2
    exit 1
  fi

  if [ -n "$(
    {
      git diff --name-only --diff-filter=ACMR "$base...HEAD" -- 'CodeMetricsConfig.txt'
      git diff --name-only --diff-filter=ACMR HEAD -- 'CodeMetricsConfig.txt'
      git ls-files --others --exclude-standard -- 'CodeMetricsConfig.txt'
    } | sort -u
  )" ]; then
    config_changed=true
  fi

  mapfile -t files < <(
    {
      git diff --name-only --diff-filter=ACMR "$base...HEAD" -- '*.cs'
      git diff --name-only --diff-filter=ACMR HEAD -- '*.cs'
      git ls-files --others --exclude-standard -- '*.cs'
    } | sort -u
  )
fi

status=0

# CA1509 (invalid CodeMetricsConfig.txt entry) is reported on the config file,
# so it can't be filtered with dotnet format's --include. Promote it to an error
# via a build when the config itself changed.
if [ "$config_changed" = true ]; then
  echo "CodeMetricsConfig.txt changed; validating CA1509..."
  if ! dotnet build src/MakaMek.Core/MakaMek.Core.csproj -warnaserror:CA1509 -v:q; then
    status=1
  fi
fi

if [ -z "${files[*]-}" ]; then
  echo "No changed C# files to analyze (base: $base)."
  exit "$status"
fi

# Group changed files by their owning project so platform heads
# (Android/iOS) are only loaded when they actually changed.
declare -A project_files
for file in "${files[@]}"; do
  case "$file" in
    src/MakaMek.Core/*.cs|src/MakaMek.Presentation/*.cs|src/MakaMek.Map/*.cs|src/MakaMek.Services/*.cs|src/MakaMek.Assets/*.cs|src/MakaMek.Localization/*.cs|src/MakaMek.Bots/*.cs) ;;
    *)
      echo "Skipping non-library code: $file" >&2
      continue
      ;;
  esac
  if [ ! -f "$file" ]; then
    echo "Skipping missing file: $file" >&2
    continue
  fi

  dir="$(dirname "$file")"
  while [ "$dir" != "." ] && ! compgen -G "$dir/*.csproj" >/dev/null; do
    dir="$(dirname "$dir")"
  done
  mapfile -t found < <(compgen -G "$dir/*.csproj")
  if [ -z "${found[0]-}" ] || [ -n "${found[1]-}" ]; then
    echo "ERROR: could not determine a single project for $file" >&2
    exit 1
  fi
  project_files["${found[0]}"]+="$file"$'\n'
done

if [ -z "${project_files[*]-}" ]; then
  echo "No C# files to analyze."
  exit "$status"
fi

for project in "${!project_files[@]}"; do
  mapfile -t project_changed < <(printf '%s' "${project_files[$project]}")
  echo "Analyzing changed file(s) in $project:"
  printf '  %s\n' "${project_changed[@]}"
  if ! dotnet format analyzers "$project" \
    --verify-no-changes \
    --severity warn \
    --include "${project_changed[@]}"; then
    status=1
  fi
done

exit "$status"
'''

[tasks.test-architecture]
description = "Runs the ArchUnitNET architecture test suite"
run = "dotnet test tests/MakaMek.Architecture.Tests/MakaMek.Architecture.Tests.csproj"
