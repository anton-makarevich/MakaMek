<!DOCTYPE html>
<html lang="en">

<head>
    <title>MakaMek.Avalonia.Browser</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./app.css" />
    <!-- Load the cache storage JavaScript module for IndexedDB operations -->
    <script type='module' src="./cacheStorage.js"></script>
</head>

<body style="margin: 0; overflow: hidden">
<div id="out">
    <div class="avalonia-splash">
        <img src="logo.png" alt="MakaMek Logo">
        <div id="splash-status" aria-live="polite">Loading…</div>
        <div class="splash-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Loading MakaMek">
            <div id="splash-progress-fill" class="splash-progress-fill"></div>
        </div>
        <div id="splash-percent">0%</div>
        <div id="splash-error" class="splash-error hidden" role="alert"></div>
    </div>
</div>
<script type='module' src="./main.js"></script>
</body>

</html>
